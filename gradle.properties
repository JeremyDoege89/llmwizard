org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# This build host has no working IPv6 route while DNS returns AAAA first for
# most CDNs, which makes Gradle's downloads hang. Force IPv4 for the JVM.
systemProp.java.net.preferIPv4Stack=true
